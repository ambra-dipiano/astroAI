# GENERIC CONFIGURATION
samples:                           # number of samples
start_seed:                        # starting seed of sample

# SIMULATIONS PARAMETERS
simulation:
  directory:                       # path to data directory
  datfile:                         # name of infotable in data directory
  id:                              # empty to process full dataset - individual observation id to process single dl3
  point_ra:                        # empty to process full dataset - individual RA of observation pointing to process single dl3
  point_dec:                       # empty to process full dataset - individual DEC of observation pointing to process single dl3
  skyframeref:                     # observation sky frame, typically icrs or fk5
  skyframeunitref:                 # observation sky frame unit, typically deg

# PREPROCESS CONFIGURATION
preprocess:
  directory:                       # path to data directory
  infotable:                       # name of infotable in data directory
  sample:                          # number of total samples
  time_start:                      # time start of observation
  time_stop:                       # time stop of observation
  binning:                         # map binning 
  smoothing:                       # Gaussian smoothing kernel
  mode:                            # pipeline mode: clean, localise, full
  norm_value:                      # 1 = single map normalisation; 0 = no normalisation; float = dataset overall normalisation value
  stretch:                         # add stretch to normalisation
  saveas:                          # name of dataset to save

# CNN TRAINING CONFIGURATION
cnn_train:
  directory:                       # path to dataset directory
  dataset:                         # dataset name
  saveas:                          # name of model to save
  mode:                            # CNN modality: clean, localise
  reshape:                         # reshape input
  split:                           # slipt ratio (train percentage)
  batch_sz:                        # training batch size
  epochs:                          # training epochs
  learning:                        # model learning rate
  shuffle:                         # training with shuffle
  layers:
    # CLEANER AND REGRESSOR LAYERS 
    conv_filter:                   # Conv2D filter
    conv_kernel:                   # Conv2D kernel
    sampling_kernel:               # AvgPool kernel
    # REGRESSOR LAYERS ONLY
    number_convs:                  # Number of Conv2D layers after the 1st one
    dropout:                       # Dropout rate
    dense:                         # Dense layer size

# CNN INFERENCE CONFIGURATION
cnn_inference:
  mode:                            # pipeline modality: clean, localise, full
  cleaner_model:                   # name/path of cleaner model
  regressor_model:                 # name/path of regressor model

# EXECUTION OPTIONS
execute:
  outdir:                          # path to output directory
  outfile:                         # output file name
  savefits:                        # option to save fits products (yes/no)
  plotfullfov:                     # option to plot full FOV plots (yes/no)
  makemap:                         # option to compute maps (yes/no)
  mapreg:                          # option to save regions file (yes/no)
  maproi:                          # map region radius, typically in deg
  benchmark:                       # option to run benchmark products (yes/no)

# BENCHMARK OPTIONS
benchmark:
  compare_with_gammapy:            # option to compare with gammapy results file (yes/no)
  gammapy_file:                    # gammapy results file path
  save_loc_error:                  # save localisation error products (yes/no)
  save_cleaning_error:             # save cleaning error products (yes/no)